name: Deploy Dragonwilds Sync website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/**'
      - 'help/**'
      - 'resources/world-builder-presets.json'
      - 'resources/platform-registry.json'
      - 'renderer/assets/application-icon.png'
      - 'renderer/assets/singleplayer-banner.png'
      - 'renderer/assets/world-selection-background.png'
      - 'renderer/assets/flags/**'
      - 'renderer/assets/platforms/**'
      - 'renderer/assets/help/**'
      - 'renderer/assets/navigation/**'
      - 'renderer/assets/rsdw-toolkit/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/placards _site/assets/platforms

          cp -R website/. _site/
          cp -R help _site/help
          cp -R renderer/assets/help _site/assets/help
          cp -R renderer/assets/navigation _site/assets/navigation
          cp -R renderer/assets/rsdw-toolkit _site/assets/rsdw-toolkit
          cp renderer/assets/application-icon.png _site/assets/application-icon.png
          cp renderer/assets/singleplayer-banner.png _site/assets/hero-banner.png
          cp renderer/assets/world-selection-background.png _site/assets/world-selection-background.png
          cp resources/world-builder-presets.json _site/assets/world-builder-presets.json
          cp resources/platform-registry.json _site/assets/platform-registry.json
          cp -R renderer/assets/flags _site/assets/flags
          cp -R renderer/assets/platforms/. _site/assets/platforms/

          printf '%s\n' '{"available":false,"appid":"4019830","branch":"public","buildid":"","source":"Website static fallback"}' > _site/assets/server-build.json

          # Exact baked placard artwork from the application repository.
          curl --fail --silent --show-error --location --retry 3 -H 'Accept: application/vnd.github.raw+json' -H 'Authorization: Bearer ${{ github.token }}' 'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/498243def697d1832e5ef76b16d0f481c3e971a9' -o _site/assets/placards/1.png
          curl --fail --silent --show-error --location --retry 3 -H 'Accept: application/vnd.github.raw+json' -H 'Authorization: Bearer ${{ github.token }}' 'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/e9b14c092045c501b2c5337956460699c04bd6d5' -o _site/assets/placards/2.png
          curl --fail --silent --show-error --location --retry 3 -H 'Accept: application/vnd.github.raw+json' -H 'Authorization: Bearer ${{ github.token }}' 'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/5a515286435834c673f532c2ae1db012cc22bd1d' -o _site/assets/placards/3.png
          curl --fail --silent --show-error --location --retry 3 -H 'Accept: application/vnd.github.raw+json' -H 'Authorization: Bearer ${{ github.token }}' 'https://api.github.com/repos/gh0sted5456-us/Dragonwilds-Sync/git/blobs/63743edf52312e65c75d36826d2fc159ab861870' -o _site/assets/placards/4.png

          # Keep the public Dragonwilds Sync release record sourced from the app repository.
          curl --fail --silent --show-error --location --retry 3 \
            'https://raw.githubusercontent.com/gh0sted5456-us/Dragonwilds-Sync/main/docs/changelog.json' \
            -o /tmp/dragonwilds-sync-changelog.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/dragonwilds-sync-changelog.json').read_text(encoding='utf-8'))
          releases = source.get('releases') or []
          if not releases:
              raise SystemExit('Application changelog has no release records')
          release = releases[0]
          public = {
              'schema': 'dragonwilds-sync-release/v1',
              'version': release.get('version', ''),
              'title': release.get('title', 'V3'),
              'date': release.get('date', ''),
              'status': release.get('status', ''),
              'source': 'https://github.com/gh0sted5456-us/Dragonwilds-Sync/blob/main/docs/changelog.json',
              'summary': release.get('summary', ''),
              'highlights': release.get('highlights') or [],
          }
          Path('_site/assets/release-changelog.json').write_text(json.dumps(public, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          # Legacy/deep pages still use the original shared bundles.
          printf '\n\n/* App placard parity layer */\n' >> _site/styles.css
          cat website/placards.css >> _site/styles.css
          printf '\n\n/* Interactive placard Rules / Mods details */\n' >> _site/styles.css
          cat website/placard-detail-popovers.css >> _site/styles.css
          printf '\n\n/* Placard icon + motion enhancements */\n' >> _site/styles.css
          cat website/placard-enhancements.css >> _site/styles.css
          printf '\n\n/* World Builder */\n' >> _site/styles.css
          cat website/home-demo.css >> _site/styles.css

          printf '\n\n/* App placard parity layer */\n' >> _site/script.js
          cat website/placards.js >> _site/script.js
          printf '\n\n/* Placard icon enhancements */\n' >> _site/script.js
          cat website/placard-enhancements.js >> _site/script.js
          printf '\n\n/* Canonical baked platform assets */\n' >> _site/script.js
          cat website/platform-assets.js >> _site/script.js
          printf '\n\n/* Steam dedicated-server build decoration */\n' >> _site/script.js
          cat website/server-build.js >> _site/script.js

          touch _site/.nojekyll

      - name: Validate website
        shell: bash
        run: |
          set -euo pipefail

          # Public front doors introduced by the simplified site.
          public_pages=(index.html downloads.html runeschema.html changelog.html docs.html)
          for page in "${public_pages[@]}"; do
            test -s "_site/$page" || { echo "Missing public page: $page" >&2; exit 1; }
            grep -q 'site-overhaul.css' "_site/$page"
            grep -q 'site-overhaul.js' "_site/$page"
          done

          # Deep documentation remains published and reachable from Docs.
          legacy_pages=(about.html experience.html setup.html world-builder.html launcher-preview.html tech.html testers.html helpy.html servers.html invite.html for-modders.html modding.html mod-packaging.html)
          for page in "${legacy_pages[@]}"; do
            test -s "_site/$page" || { echo "Missing documentation page: $page" >&2; exit 1; }
          done

          # The simplified navigation contract should stay small and consistent.
          for page in index.html downloads.html runeschema.html changelog.html docs.html; do
            grep -q 'href="index.html"' "_site/$page"
            grep -q 'href="downloads.html"' "_site/$page"
            grep -q 'href="runeschema.html"' "_site/$page"
            grep -q 'href="changelog.html"' "_site/$page"
            grep -q 'href="docs.html"' "_site/$page"
          done
          grep -q '0.6.1E Experimental' _site/changelog.html
          grep -q 'Changes since 0.6.0' _site/changelog.html
          grep -q 'Deterministic mod management' _site/changelog.html
          grep -q 'Okaetsu' _site/changelog.html
          grep -q 'Snorkles' _site/changelog.html
          grep -q 'Jonesing4Space' _site/changelog.html

          python3 scripts/validate-site.py _site
          node --test scripts/release-resolution.test.cjs
          for script in _site/*.js; do node --check "$script"; done

          # JavaScript syntax for both the new shell and retained deep pages.
          node --check _site/site-overhaul.js
          node --check _site/script.js
          node --check _site/home-demo.js
          node --check _site/world-draft-onboarding.js
          node --check _site/helpy.js
          node --check _site/launcher-preview.js
          node --check _site/downloads-linux.js
          node --check _site/downloads-flavor.js
          node --check _site/release-changelog.js
          node --check _site/runeschema-variant.js
          node --check _site/server-list.js
          node --check _site/world-invite.js

          # Public-directory security boundaries remain unchanged.
          test -s _site/servers.html
          test -s _site/server-list.js
          test -s _site/app-join-dialog.css
          test ! -e _site/public-directory-view.js || { echo 'Public directory runtime must not be deployed' >&2; exit 1; }
          test ! -e _site/public-directory-fetch-fallback.js || { echo 'Public directory fallback must not be deployed' >&2; exit 1; }
          test ! -e _site/assets/public-worlds-fallback.json || { echo 'Public world snapshot must not be deployed' >&2; exit 1; }
          grep -q 'signed-launcher-heartbeats-only' _site/directory-source.json
          grep -q 'dragonwilds-sync-directory.dragonwilds.workers.dev/api/v1/worlds' _site/server-list.js
          grep -q '/api/v1/invites' _site/server-list.js
          grep -q 'dragonwilds-sync://join' _site/world-invite.js
          grep -q 'dragonwilds-sync://join' _site/server-list.js
          grep -q 'dialog.showModal()' _site/server-list.js
          grep -q 'dialog.showModal()' _site/world-invite.js

          # Setup and reference assets still retain their technical contracts.
          grep -q 'UDP 8422' _site/setup.html
          grep -q 'TCP 27051' _site/setup.html
          grep -q 'TCP 27080' _site/setup.html
          grep -q 'dwmapi.dll' _site/setup.html
          grep -q 'CGNAT' _site/setup.html
          ! grep -q 'TCP 8422' _site/setup.html
          ! grep -q 'dwampi.dll' _site/setup.html
          test -s _site/assets/downloads/RuneSchema-0.6.3-Experimental.zip
          unzip -tqq _site/assets/downloads/RuneSchema-0.6.3-Experimental.zip

          python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('_site/assets/release-changelog.json').read_text(encoding='utf-8'))
          assert release['schema'] == 'dragonwilds-sync-release/v1'
          assert release.get('version')
          assert release.get('title')
          assert release.get('status')
          assert release.get('highlights')

          presets = json.loads(Path('_site/assets/world-builder-presets.json').read_text(encoding='utf-8'))
          assert presets.get('format') == 'dragonwilds-sync-world-builder-presets'
          assert int(presets.get('version') or 0) == 1
          platforms = json.loads(Path('_site/assets/platform-registry.json').read_text(encoding='utf-8'))
          assert platforms.get('format') == 'dragonwilds-sync-platform-registry'
          PY

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
